<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Business Card</title>
    </head>
    <body>
        <div class="business-card">
            <img
                class="profile-image"
                src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
                alt="Profile Image"
            />

            <p class="full-name">Ruben Cahyadi</p>
            <p class="designation">Junior Web Developer</p>
            <p class="company">Facebook</p>

            <hr />

            <p class="email-address">example@email.com</p>
            <p class="phone-number">5555555555</p>

            <a class="portfolio-link" href="http://example.com">Portfolio</a>

            <hr />

            <div class="social-media">
                <h2>Connect with me</h2>
                <a href="https://twitter.com">Twitter</a>
                <a href="https://linkedin.com">LinkedIn</a>
                <a href="https://github.com">GitHub</a>
            </div>
        </div>
    </body>
</html>
