<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Contact Form</title>
    </head>
    <body>
        <div class="form-container">
            <form>
                <!-- Form Title -->
                <h2>Contact Us</h2>

                <!-- Name field -->
                <label for="name">Name: </label>
                <input id="name" name="form-field" type="text" required />

                <!-- Email field -->
                <label for="email">Email: </label>
                <input id="email" name="form-field" type="email" required />

                <!-- Message Text Area -->
                <label for="message">Message: </label>
                <textarea id="message" name="form-field" required></textarea>

                <!-- Submit button -->
                <button type="submit">Submit</button>
            </form>
        </div>
    </body>
</html>
