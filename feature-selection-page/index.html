<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Selection Feature Page</title>
    </head>
    <body>
        <h1>Feature Selection</h1>
        <div class="feature-card-container">
            <label class="feature-card" for="cloud-storage-checkbox">
                <input type="checkbox" />
                <h4>Cloud Storage</h4>
                <p>100 Gigabyte secure storage</p>
            </label>

            <label class="feature-card" for="dedicated-support-checkbox">
                <input type="checkbox" />
                <h4>Dedicated Support</h4>
                <p>24/7 customer help</p>
            </label>

            <label class="feature-card" for="advance-analytics-checkbox">
                <input type="checkbox" />
                <h4>Advance Analytics</h4>
                <p>Inisights & reports</p>
            </label>

            <label class="feature-card" for="custom-user-themes-checkbox">
                <input type="checkbox" />
                <h4>Custom User Themes</h4>
                <p>Personalized dashboard design</p>
            </label>

            <label class="feature-card" for="multi-user-collab-checkbox">
                <input type="checkbox" />
                <h4>Multi-User Collab</h4>
                <p>Team access and sharing</p>
            </label>

            <label class="feature-card" for="api-access-checkbox">
                <input type="checkbox" />
                <h4>API Access</h4>
                <p>Integrate with your custom built tools</p>
            </label>
        </div>
    </body>
</html>
